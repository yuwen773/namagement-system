openapi: 3.0.3
info:
  title: 旅游景点推荐系统 API
  version: 1.0.0
  description: 旅游景点推荐系统后端接口文档
paths:
  /api/accounts/change-password/:
    post:
      operationId: accounts_change_password_create
      description: 修改密码接口
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/delete-account/:
    delete:
      operationId: accounts_delete_account_destroy
      description: 逻辑删除当前用户
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/login/:
    post:
      operationId: accounts_login_create
      description: 用户登录接口
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/profile/:
    get:
      operationId: accounts_profile_retrieve
      description: 获取当前用户信息
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: accounts_profile_update
      description: 更新当前用户信息
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/accounts/register/:
    post:
      operationId: accounts_register_create
      description: 用户注册接口
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegister'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/accounts/token/refresh/:
    post:
      operationId: accounts_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/attractions/:
    get:
      operationId: attractions_list
      description: 获取景点列表
      parameters:
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      tags:
      - attractions
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttractionListList'
          description: ''
    post:
      operationId: attractions_create
      description: 创建景点
      tags:
      - attractions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttractionCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttractionCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttractionCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttractionCreateUpdate'
          description: ''
  /api/attractions/{id}/:
    get:
      operationId: attractions_retrieve
      description: 获取景点详情
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 attraction 的 唯一整数值。
        required: true
      tags:
      - attractions
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttractionDetail'
          description: ''
    put:
      operationId: attractions_update
      description: 更新景点
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 attraction 的 唯一整数值。
        required: true
      tags:
      - attractions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttractionCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttractionCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttractionCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttractionCreateUpdate'
          description: ''
    patch:
      operationId: attractions_partial_update
      description: 景点视图集
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 attraction 的 唯一整数值。
        required: true
      tags:
      - attractions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAttractionCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAttractionCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAttractionCreateUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttractionCreateUpdate'
          description: ''
    delete:
      operationId: attractions_destroy
      description: 删除景点（逻辑删除）
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 attraction 的 唯一整数值。
        required: true
      tags:
      - attractions
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/attractions/search/:
    get:
